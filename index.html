<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rdolovich</title>

    <link
        rel="icon"
        href="assets/favicon.svg"
        type="image/svg+xml"
    >


<meta
    property="og:title"
    content="Rdolovich"
>

<meta
    property="og:description"
    content="Developer · Creator · Links"
>

<meta
    property="og:type"
    content="website"
>

<meta
    property="og:url"
    content="https://YOUR-DOMAIN.com/"
>

<meta
    property="og:image"
    content="https://YOUR-DOMAIN.com/assets/preview.jpg"
>

<meta
    name="twitter:card"
    content="summary_large_image"
>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="cursor-glow"></div>

<div class="page">

    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >
        <source src="assets/background.mp4" type="video/mp4">
    
    </video>

    <div class="background-overlay"></div>

    <main class="profile">

        <div class="profile-avatar-wrapper">
            
            <video
                src="assets/avatar.mp4"
                class="profile-avatar"
                autoplay
                muted
                loop
                playsinline
            >   
            
            </video>
            
        </div>

        <h1>
            Rdolovich
        </h1>

        <p class="description">
            Developer · Creator · Just one of us
        </p>

        <p class="location">
            Moscow
        </p>

        <div class="profile-status">
            
            <div class="online-status">
                <span class="online-dot"></span>
                <span>Online</span>
            </div>

            <div class="view-counter">
                <span>◉</span>
                <span id="views">0</span>
            </div>

        </div>

        <div class="links">

            <a href="https://t.me/nondrugaddict" class="link-card">
                <div class="link-info">

                    <img
                        class="link-icon"
                        src="https://cdn.simpleicons.org/telegram/ffffff"
                        alt=""
                    >

                    <span>Telegram</span>
                    
                </div>

                <span class="link-arrow">↗</span>

            </a>
                
            <a href="https://t.me/emgiar" class="link-card">
                <div class="link-info">

                    <img
                        class="link-icon"
                        src="https://cdn.simpleicons.org/telegram/ffffff"
                        alt=""
                    >

                    <span>Telegram channel</span>

                </div>

                <span class="link-arrow">↗</span>

            </a>

            <a href="https://github.com/ruslancikplayers-hash" class="link-card">

                <div class="link-info">

                    <img
                        class="link-icon"
                        src="https://cdn.simpleicons.org/github/ffffff"
                        alt=""
                    >
                
                    <span>GitHub</span>

                </div>

                <span class="link-arrow">↗</span>

            </a>
            
            <a href="https://steamcommunity.com/profiles/76561199672364598/" class="link-card">

                <div class="link-info">

                    <img
                        class="link-icon"
                        src="https://cdn.simpleicons.org/steam/ffffff"
                        alt=""
                    >

                    <span>Steam</span>

                </div>

                <span class="link-arrow">↗</span>

            </a>

            <a href="https://lolz.team/members/9432301/" class="link-card">

                <div class="link-info">
                    <img    
                        class="link-icon lolz-icon"
                        src="assets/lolz.png"
                        alt="lolz"
                    >

                    <span>Lolz</span>

                </div>

                <span class="link-arrow">↗</span>

            </a>

        </div>

    </main>

    <audio 
        id="music"
        autoplay
        loop
    >
        <source src="assets/music.mp3" type="audio/mpeg">
    </audio>

    <button

            class="music-button"
            type="button"
            aria-label="Музыка"
    >
        <svg
            class="music-svg"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path
                d="M4 9V15H8L13 19V5L8 9H4Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

            <path
                class="sound-wave"
                d="M16 9C17.2 10.2 17.2 13.8 16 15"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
            />

            <path
                class="sound-wave"
                d="M19 6.5C21.8 9.3 21.8 14.7 19 17.5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
            />
        </svg>
        
    </button>

<script src="script.js"></script>

</body>
</html>
